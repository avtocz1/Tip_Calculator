<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <title>Tip Calculator app</title>
    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<body>
    <header>
        <h1>SPLI<br />TTER</h1>
    </header>
    <main>
    <div class="calculator-controls">
        <p class="bill-title title">Bill</p>
        <div class="bill-bar bar">
            <img src="./images/icon-dollar.svg" alt="dollar sign svg">
            <input class="input" id="bill-input" name="bill_inp" type="number" placeholder="0">
        </div>
        <div class="tip-selection-wrapper">
            <p class="select-tip title">Select Tip %</p>
            <div class="tips-choice">
                <button class="5-percent tip btn" id="btn" type="button">5%</button>
                <button class="10-percent tip btn" id="btn" type="button">10%</button>
                <button class="15-percent tip btn" id="btn" type="button">15%</button>
                <button class="25-percent tip btn" id="btn" type="button">25%</button>
                <button class="50-percent tip btn" id="btn" type="button">50%</button>
                <div class="custom-bar">
                    <input class="custom-tip input" id="custom-tip" type="number" placeholder="Custom"></input>
                </div>
            </div>
        </div>
        <div class="number-of-people-wrapper">
            <p class="number-of-people title">Number of people</p>
            <div class="number-of-people-bar bar">
                <img src="./images/icon-person.svg" alt="people svg"/>
                <input class="input person-input" id="amount-of-people" type="number" placeholder="0">
            </div>
        </div>
    </div>
    <div class="result-wrapper">
        <div class="labels-wrapper">
            <div class="tip-wrapper">
                <div class="label">
                    <span class="tip-amount note">Tip Amount</span>
                    <span class="per-person">/ Person</span>
                </div>
                <span class="result" id="result">$0.00</span>
            </div>
            <div class="tip-wrapper">
                <div class="label">
                    <span class="tip-amount note">Total</span>
                    <span class="per-person">/ Person</span>
                </div>
                <span class="result" id="result">$0.00</span>
            </div>
        </div>
        <button class="reset-btn btn" type="reset" disabled>RESET</button>
    </div>
    <!-- </div> -->
    </main>
</body>
</html>
